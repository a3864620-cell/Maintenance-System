<title>叫修系統</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script>
/* 版本號:每次改完 index.html 上傳到 GitHub 前,把這個改成新的(例如日期加序號),
   手機打開時發現 GitHub 上的版本號不一樣,就會出現「點這裡更新」 */
var APP_VERSION = "2026-09-29.4";
/* 放在 GitHub 等外部網站時,API 網址填這裡(Apps Script 部署後的 /exec 網址) */
var API_URL = "https://script.google.com/macros/s/AKfycbzB-Ry74ubI9b-B3zg_uWy39OaMzKjkWGeeDC3huIC3dyMDHjwsIE9tDDi0fjYIpZSrpA/exec";
/* 網頁一打開就先去抓資料,跟下載 React 同時進行,不用等畫面程式載完才開始抓 */
window.__BOOT__ = (function () {
  try {
    if (window.google && window.google.script) return null;
    var pw = localStorage.getItem("repair_api_password");
    if (!pw) return null;
    return fetch(API_URL, { method: "POST", body: JSON.stringify({ fn: "getBootstrap", args: [], password: pw }) })
      .then(function (r) { return r.json(); });
  } catch (e) { return null; }
})();
if (window.__BOOT__) window.__BOOT__.catch(function () {});
</script>
<style id="print-page-style"></style>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page-plane: #f5f5f3;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-dark: #184f95;
    --good: #0ca30c;
    --good-bg: #e7f6e7;
    --warning: #fab219;
    --warning-bg: #fff6e0;
    --critical: #d03b3b;
    --critical-bg: #fbe9e9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  #root { min-height: 100vh; }

  .app-shell { display: flex; flex-direction: column; min-height: 100vh; max-width: 640px; margin: 0 auto; background: var(--page-plane); }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px; gap: 8px;
  }
  .top-bar-title { font-size: 18px; font-weight: 700; }
  .top-bar-actions { display: flex; gap: 6px; align-items: center; }
  .sync-line {
    display: flex; justify-content: space-between; gap: 8px; padding: 0 16px 8px;
    font-size: 12px; color: var(--muted);
  }
  .sync-line button { background: none; border: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
  .sync-warn {
    margin: 0 16px 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;
    background: var(--warning-bg); border: 1px solid var(--warning); color: #7a5200;
  }
  .sync-warn-reason { font-size: 12px; margin: 2px 0 8px; word-break: break-all; }
  .update-banner {
    margin: 0 16px 8px; padding: 10px 12px; border-radius: 8px; border: none; width: calc(100% - 32px);
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .operator-select {
    font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); max-width: 40%;
  }

  .tab-bar {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 12px;
  }
  .tab-btn {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary); font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .main-content { flex: 1; padding: 4px 16px 40px; }

  .page-title { font-size: 20px; font-weight: 700; margin: 4px 0 14px; }
  .page-hint { color: var(--text-secondary); font-size: 13px; margin: -6px 0 14px; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--text-secondary); margin: 22px 0 8px; }

  .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .input {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--gridline); background: var(--surface-1); color: var(--text-primary);
  }
  .input:focus { outline: none; border-color: var(--accent); }
  textarea.input { resize: vertical; font-family: inherit; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 14px; color: var(--text-primary); }
  .checkbox-row input { width: 18px; height: 18px; }

  .btn {
    display: inline-block; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-block { display: block; width: 100%; margin-top: 18px; text-align: center; }
  .btn-ghost {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); font-size: 13px; cursor: pointer;
  }
  .btn-link {
    display: inline-block; margin-top: 10px; background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 0;
  }

  .part-picker { position: relative; }
  .suggest-list {
    position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface-1); border: 1px solid var(--gridline); border-radius: 10px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 6px 20px rgba(11,11,11,0.12);
  }
  .suggest-item { padding: 10px 12px; border-bottom: 1px solid var(--gridline); cursor: pointer; }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active { background: var(--page-plane); }
  .suggest-model { font-weight: 700; font-size: 14px; }
  .suggest-name { font-size: 13px; color: var(--text-secondary); }
  .suggest-stock { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .suggest-empty { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-1); border: 1px solid var(--gridline); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--muted); }

  .part-chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: 1px solid var(--gridline); border-radius: 10px; background: var(--surface-1); }
  .part-chip-model { font-weight: 700; font-size: 15px; }
  .part-chip-name { font-size: 13px; color: var(--text-secondary); }
  .part-chip-stock { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .text-critical { color: var(--critical); font-weight: 700; }
  .warn-icon { margin-right: 4px; }

  .qty-stepper { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--gridline); background: var(--surface-1); font-size: 20px; font-weight: 700; cursor: pointer; }
  .qty-number { width: 80px; text-align: center; padding: 11px 6px; font-size: 16px; border-radius: 10px; border: 1px solid var(--gridline); background: var(--surface-1); }

  .today-list, .recent-box { margin-top: 22px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .today-list-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
  .today-item, .recent-item { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--gridline); }

  .btn-del { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--critical); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-del-yes { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--critical); background: var(--critical); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .del-confirm { display: inline-flex; gap: 6px; align-items: center; }
  .del-busy { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .recent-item { cursor: pointer; }
  .recent-item:active { background: var(--page-plane); }
  .today-item-model { font-weight: 700; }
  .today-item-customer { color: var(--text-secondary); margin-left: auto; }

  /* 領料清單:一個客戶一次可以領好幾樣 */
  .cart { margin-top: 12px; border: 1px solid var(--gridline); border-radius: 10px; background: var(--surface-1); overflow: hidden; }
  .cart-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); padding: 10px 12px; background: var(--page-plane); border-bottom: 1px solid var(--gridline); }
  .cart-item { padding: 12px; border-bottom: 1px solid var(--gridline); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .cart-item-model { font-weight: 700; font-size: 15px; }
  .cart-item-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .cart-item-stock { color: var(--muted); }
  .cart-item-controls { margin-top: 10px; }
  .cart-item-label { margin: 10px 0 0; font-size: 13px; }
  .cart-item-cost { margin-top: 10px; }
  .cart-item-cost .field-label { margin-top: 0; }
  .cart-item-amount { margin-top: 6px; font-size: 13px; }
  .cart-item-amount strong { font-size: 15px; font-variant-numeric: tabular-nums; }
  .cart-total { padding: 12px; background: var(--page-plane); border-top: 1px solid var(--gridline); font-size: 14px; }
  .cart-total strong { font-size: 18px; font-variant-numeric: tabular-nums; }

  .create-part-form, .admin-row-edit { border: 1px solid var(--gridline); border-radius: 10px; padding: 14px; margin-top: 10px; background: var(--surface-1); }

  .stock-list { margin-top: 10px; }
  .stock-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--gridline); cursor: pointer; }
  .stock-row-model { font-weight: 700; font-size: 15px; }
  .stock-row-name { font-size: 13px; color: var(--text-secondary); }
  .stock-row-qty { font-size: 16px; font-weight: 700; white-space: nowrap; }

  .empty-hint { color: var(--muted); font-size: 13px; padding: 14px 4px; text-align: center; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(11,11,11,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal { background: var(--surface-1); width: 100%; max-width: 640px; max-height: 78vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--gridline); }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .modal-body { padding: 8px 16px 20px; overflow-y: auto; }
  .history-item { padding: 8px 0; border-bottom: 1px solid var(--gridline); }
  .history-item.voided { opacity: 0.5; }
  .history-row { display: grid; grid-template-columns: 44px 88px 48px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
  .history-row-sub { font-size: 11px; color: var(--text-secondary); margin-top: 3px; padding-left: 2px; }
  .history-type { font-weight: 700; font-size: 12px; padding: 3px 6px; border-radius: 6px; text-align: center; }
  .type-IN { background: var(--good-bg); color: var(--good); }
  .type-OUT { background: #eaf1fb; color: var(--accent-dark); }
  .type-RETURN { background: var(--warning-bg); color: #8a5a00; }
  .voided-tag { font-size: 11px; color: var(--critical); }

  .sub-tab-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .sub-tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; }
  .sub-tab.active { background: var(--text-primary); border-color: var(--text-primary); color: #fff; }

  .label-queue-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--gridline); }
  .label-queue-info { flex: 1; }
  .label-queue-model { font-weight: 700; font-size: 14px; }
  .label-queue-meta { font-size: 12px; color: var(--text-secondary); }
  .label-queue-copies { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .copies-input { width: 52px; padding: 6px; border-radius: 8px; border: 1px solid var(--gridline); text-align: center; }

  .estimate-note { background: var(--warning-bg); color: #8a5a00; padding: 8px 10px; border-radius: 8px; margin: 4px 0 10px; }

  .cost-preview { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--gridline); font-size: 14px; }
  .cost-preview strong { font-size: 17px; font-variant-numeric: tabular-nums; }
  .cost-preview-note { color: var(--muted); font-size: 12px; margin-left: 6px; }

  .stat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 10px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--gridline); border-radius: 12px; padding: 14px; }
  .stat-tile-label { font-size: 12px; color: var(--text-secondary); }
  .stat-tile-value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat-tile-note { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .warn-hint { font-size: 12px; line-height: 1.5; color: #8a5a00; background: var(--warning-bg); border: 1px solid var(--warning); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .field-hint-sm { font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 4px; }
  .return-note { font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* 表格欄位變多時,讓表格自己橫向捲動,不要把整個頁面撐寬 */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 6px; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .report-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  .report-table td { padding: 8px 4px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
  .report-table td.nowrap { white-space: nowrap; }
  .est-mark { color: var(--warning); font-weight: 700; margin-left: 2px; }

  /* 可展開的統計列:點一下看這個客戶／這個人用了哪些零件 */
  .expandable-row { cursor: pointer; }
  .expandable-row:hover { background: var(--surface-1); }
  .expandable-row:active { background: var(--page-plane); }
  .expand-caret {
    display: inline-block; width: 14px; color: var(--accent); font-size: 10px;
    transition: transform 0.15s ease; margin-right: 2px;
  }
  .expand-caret.open { transform: rotate(90deg); }
  .expanded-detail > td { background: var(--page-plane); padding: 4px 4px 10px 18px; }
  .sub-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sub-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; white-space: nowrap; }
  .sub-table td { padding: 5px 6px; border-top: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }

  .date-range-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 14px; flex-wrap: wrap; }
  .date-range-row .input { flex: 1; min-width: 130px; }

  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--gridline); }
  .admin-row.inactive { opacity: 0.5; }
  .admin-row-main { flex: 1; cursor: pointer; }
  .admin-row-title { font-weight: 700; font-size: 14px; }
  .admin-row-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .label-tag { color: var(--accent); font-weight: 600; }
  .edit-actions { display: flex; gap: 10px; margin-top: 16px; }
  .inline-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .inline-add-row .input { flex: 1; }

  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; color: var(--text-secondary); }
  .error-box { display: flex; flex-direction: column; gap: 12px; align-items: center; }

  /* 操作人選擇鎖:沒選人之前整個畫面都不能動。
     用 overlay 蓋住而不是換掉整個畫面,這樣底下各頁填到一半的表單不會被清掉。 */
  .gate-mask {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(11,11,11,0.55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-box {
    width: 100%; max-width: 380px; max-height: 86vh; overflow-y: auto;
    background: var(--surface-1); border-radius: 16px; padding: 22px 20px;
    box-shadow: 0 18px 50px rgba(11,11,11,0.35);
  }
  .gate-title { font-size: 19px; font-weight: 700; text-align: center; }
  .gate-sub { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }
  .gate-reason {
    margin-top: 14px; padding: 10px 12px; border-radius: 10px;
    background: var(--warning-bg); color: #7a5200; font-size: 13px; font-weight: 600;
    text-align: center;
  }
  .gate-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .gate-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--page-plane); color: var(--text-primary);
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  .gate-btn:active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: 90%; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(11,11,11,0.25); z-index: 200; color: #fff;
  }
  .toast-success { background: var(--good); }
  .toast-error { background: var(--critical); }
  .toast-warning { background: #a86a00; }

  /* 標籤列印用一個獨立的 #print-root(portal),平常隱藏。
     螢幕顯示時完全不佔版面;列印時把 #root(整個系統畫面)整個藏起來,
     只留 #print-root。這樣才不會因為畫面其他內容還「佔著版面高度」
     (即使只是 visibility:hidden)而在標籤機印出一堆空白標籤。 */
  #print-root { display: none; }

  @media print {
    body { background: #fff; }
    #root { display: none; }
    #print-root { display: block; }
    .label {
      page-break-after: always; page-break-inside: avoid;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 1.5mm; margin: 0; overflow: hidden;
    }
    .label:last-child { page-break-after: auto; }
    .label-line { font-weight: 700; line-height: 1.25; overflow-wrap: break-word; word-break: normal; }
  }

  /* 明細列印(給助理去拿貨用的清單),跟標籤一樣透過 #print-root 這個 portal 輸出 */
  .detail-sheet { padding: 4mm; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .detail-sheet h1 { font-size: 22px; margin: 0 0 3mm; }
  .detail-sheet .detail-meta { font-size: 12px; color: #444; margin-bottom: 6mm; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
  .detail-table th, .detail-table td { border: 1px solid #999; padding: 5px 6px; text-align: left; vertical-align: top; }
  .detail-table th { background: #eee; white-space: nowrap; }
  .detail-table td.nowrap { white-space: nowrap; }
</style>
<style>
  /* ===== 以下為叫修系統新增的樣式,顏色/字體沿用上面既有的設計 tokens ===== */
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 20px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .back-btn { background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; padding: 6px 0; }

  .photo-add-btn { aspect-ratio: 1; border-radius: 10px; border: 1px dashed var(--gridline); background: var(--surface-1); color: var(--text-secondary); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: 6px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
"use strict";
var h = React.createElement;

/* ============================================================
 * 共用工具(跟庫存系統那份 Index.html 一樣的寫法)
 * ============================================================ */
/* ============================================================
 * 連線方式(同一份檔案兩邊都能用)
 * - 貼在 Apps Script 裡開啟:走 google.script.run,不需要密碼。
 * - 放在 GitHub Pages 等外部網站:走 fetch 呼叫 Apps Script 的 API(doPost),
 *   需要輸入 Settings 分頁 ApiPassword 那組存取密碼,輸入一次之後這台裝置會記住。
 * API_URL 在最上面 <head> 裡設定,換成你部署後的 /exec 網址即可。
 * ============================================================ */
var PW_KEY = "repair_api_password";
var CACHE_KEY = "repair_bootstrap_cache_v1";

function inAppsScript_() {
  return !!(window.google && window.google.script && window.google.script.run);
}
function getPw_() {
  try { return localStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; }
}

  try { if (v) localStorage.setItem(PW_KEY, v); else localStorage.removeItem(PW_KEY); } catch (e) {}
}
function needsLogin_() { return !inAppsScript_() && !getPw_(); }
function readCache_() {
  try { var s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function writeCache_(d) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
}
function clearCache_() {
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
}

/* ============================================================
 * 版本更新
 * 手機瀏覽器會把網頁存起來,GitHub 上換了新檔案,手機可能還是開到舊的。
 * 打開 App、或從背景切回來時,去 GitHub 抓一次最新的 index.html 比對版本號,
 * 不一樣就在畫面上方出現「點這裡更新」。
 * ============================================================ */
function checkForUpdate_() {
  if (inAppsScript_() || !window.fetch) return Promise.resolve(false);
  var re = new RegExp("var APP_" + "VERSION = \"([^\"]+)\"");
  return fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) {
      var m = t.match(re);
      return !!(m && m[1] && m[1] !== APP_VERSION);

    .catch(function () { return false; });
}
/** 資料時間:今天的只顯示時:分,不是今天的加上月/日 */
function fmtSyncTime_(ms) {
  if (!ms) return "先前存的";
  var d = new Date(ms), now = new Date();
  var two = function (n) { return (n < 10 ? "0" : "") + n; };
  var hm = two(d.getHours()) + ":" + two(d.getMinutes());
  return d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}
var AUTO_REFRESH_MS = 3 * 60 * 1000;   // App 開著時,每 3 分鐘自動抓一次最新資料

function forceUpdate_() {
  // 網址後面加上時間,手機就不會拿舊的存檔,一定去 GitHub 抓新的
  location.replace(location.pathname + "?v=" + Date.now());
}

function unwrapApi_(p) {
  return p.then(function (res) {
    if (res && res.ok) return res.data;
    var e = new Error((res && res.error) || "伺服器沒有回應正確的資料");
    if (res && res.code) e.code = res.code;
    throw e;
  }, function () {
    throw new Error("連不上伺服器,請檢查網路後再試一次");
  });
}

/** 拿網頁一打開就先發出去的那個請求(只能用一次);沒有的話就正常呼叫 */
function takeEarlyBoot_() {
  var p = window.__BOOT__;
  window.__BOOT__ = null;
  return p ? unwrapApi_(p) : gsRun("getBootstrap");
}

function gsRun(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (inAppsScript_()) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        reject(new Error(err && err.message ? err.message : String(err)));
      });
      runner[fnName].apply(runner, args);

  return unwrapApi_(fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ fn: fnName, args: args, password: getPw_() })
  }).then(function (r) { return r.json(); }));
}

function txt(v) {
  return v === undefined || v === null ? "" : String(v);
}

function pad2_(n) { return (n < 10 ? "0" : "") + n; }

function nowLocalInputValue() {
  var d = new Date();
  return d.getFullYear() + "-" + pad2_(d.getMonth() + 1) + "-" + pad2_(d.getDate()) + "T" + pad2_(d.getHours()) + ":" + pad2_(d.getMinutes());
}

function fmtDateTime(v) {
  if (!v) return "";
  var s = String(v).replace(" ", "T");
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2_(d.getHours()) + ":" + pad2_(d.getMinutes());
}

function statusColor(status) {
  if (status === "已完成") return { background: "var(--good-bg)", color: "var(--good)" };
  if (status === "待料") return { background: "var(--warning-bg)", color: "#8a5a00" };
  if (status === "待下次送碳粉") return { background: "#eaf1fb", color: "var(--accent-dark)" };
  return { background: "var(--critical-bg)", color: "var(--critical)" };
}

/* ============================================================
 * 小元件
 * ============================================================ */
function Toast(props) {
  if (!props.toast) return null;
  return h("div", { className: "toast toast-" + props.toast.type }, props.toast.message);
}

function ToggleRow(props) {
  // options: string[]; value: string; onChange(v)
  return h("div", { className: "toggle-row" },
    props.options.map(function (opt) {
      return h("button", {
        key: opt,
        type: "button",
        className: "toggle-btn" + (props.value === opt ? " active" : ""),
        onClick: function () { props.onChange(opt); }
      }, opt);
    })
  );
}

function MultiToggleRow(props) {
  // options: string[]; value: string[]; onChange(newArray) —— 可以同時選多個,再點一次取消
  var selected = props.value || [];
  return h("div", { className: "toggle-row" },
    props.options.map(function (opt) {
      var active = selected.indexOf(opt) !== -1;
      return h("button", {
        key: opt,
        type: "button",
        className: "toggle-btn" + (active ? " active" : ""),
        onClick: function () {
          if (active) props.onChange(selected.filter(function (v) { return v !== opt; }));
          else props.onChange(selected.concat([opt]));
        }
      }, opt);
    })
  );
}

function TicketCard(props) {
  var t = props.ticket;
  var sc = statusColor(t.status);
  return h("div", { className: "ticket-card", style: props.cardStyle, onClick: function () { if (props.onOpen) props.onOpen(t); } },
    h("div", { className: "ticket-card-top" },
      h("div", null,
        h("div", { className: "ticket-card-customer" }, t.customerName),
        h("div", { className: "ticket-card-id" }, (props.idText || "#" + t.ticketId) + "　" + fmtDateTime(t.createdAt))
      ),
      h("span", { className: "status-badge", style: sc }, t.status)
    ),
    h("div", { className: "ticket-card-meta" },
      h("span", { className: "dispatch-tag" }, t.dispatchType),
      t.technician ? h("span", null, "👤 " + String(t.technician).split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean).join("、")) : h("span", { style: { color: "var(--muted)" } }, "尚未指派"),
      t.parts && t.parts.length ? h("span", null, "🔧 " + t.parts.length + " 項零件") : null,
      t.status === "待下次送碳粉" && t.meterCustomerName ? h("span", null, "📋 抄表提醒:" + t.meterCustomerName) : null
    ),
    t.description ? h("div", { className: "ticket-card-desc" }, t.description) : null,
    props.children
  );
}

/* ============================================================
 * 叫修列表頁
 * ============================================================ */
function TicketListPage(props) {
  // 分頁記在 App 那層:每次打開 App 預設「未處理」,點進單子再回來會停在原本的分頁
  var filter = props.filter || props.statusList[0], setFilter = props.onFilter;
  var tabs = props.statusList.concat(["送貨", "全部"]);
  function matches(t) {
    if (filter === "全部") return true;
    // 「送貨」看的是派工類別,而且只列還沒完成的,出車前一眼就知道有哪幾家要送
    if (filter === "送貨") return t.dispatchType === "送貨" && t.status !== "已完成";
    return t.status === filter;
  }
  var filtered = props.tickets.filter(matches);
  // 還在背景送出的新單,馬上照狀態出現在對應分頁;沒存成功的每一頁都看得到
  var pendingShown = (props.pending || []).filter(function (p) { return p.state === "failed" || matches(p.payload); });

  return h("div", null,
    h("div", { className: "page-title" }, "叫修列表"),
    h("div", { className: "sub-tab-row" },
      tabs.map(function (tab) {
        return h("button", {
          key: tab, type: "button",
          className: "sub-tab" + (filter === tab ? " active" : ""),
          onClick: function () { setFilter(tab); }
        }, tab);
      })
    ),
    pendingShown.map(function (p) {
      var failed = p.state === "failed";
      return h(TicketCard, {
        key: "p" + p.localId,
        ticket: Object.assign({}, p.payload, { parts: [] }),
        idText: failed ? "⚠️ 沒有存成功" : "⏳ 儲存中",
        cardStyle: failed ? { borderColor: "var(--critical)" } : { opacity: 0.75 }
      },
        failed ? h("div", { style: { marginTop: "8px" } },
          h("div", { className: "field-hint-sm", style: { color: "var(--critical)" } }, p.error),
          h("div", { style: { display: "flex", gap: "8px", marginTop: "8px" } },
            h("button", { className: "btn btn-primary", onClick: function (e) { e.stopPropagation(); props.onRetry(p); } }, "重新送出"),
            h("button", { className: "btn", onClick: function (e) { e.stopPropagation(); props.onDiscard(p); } }, "放棄這張")
          )
        ) : null
      );
    }),
    filtered.length === 0 && !pendingShown.length ? h("div", { className: "empty-hint" }, "沒有符合的叫修單") :
      filtered.map(function (t) { return h(TicketCard, { key: t.ticketId, ticket: t, onOpen: props.onOpen }); }),
    h("button", { className: "fab", onClick: props.onNew, title: "新增叫修" }, "+")
  );
}

/* ============================================================
 * 叫修單表單頁(新增 / 編輯)
 * ============================================================ */
function TicketFormPage(props) {
  var editing = props.ticket; // null = 新增
  var isNew = !editing;

  var _createdAt = React.useState(editing ? editing.createdAt : nowLocalInputValue()), createdAt = _createdAt[0], setCreatedAt = _createdAt[1];

  var _customerName = React.useState(editing ? editing.customerName : ""), customerName = _customerName[0], setCustomerName = _customerName[1];
  var _customerQuery = React.useState(""), customerQuery = _customerQuery[0], setCustomerQuery = _customerQuery[1];
  var _showCustPicker = React.useState(false), showCustPicker = _showCustPicker[0], setShowCustPicker = _showCustPicker[1];

  var _technician = React.useState(editing && editing.technician ? String(editing.technician).split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean) : []), technicianList = _technician[0], setTechnicianList = _technician[1];
  var _status = React.useState(editing ? editing.status : props.statusList[0]), status = _status[0], setStatus = _status[1];
  var _note = React.useState(editing ? editing.note : ""), note = _note[0], setNote = _note[1];
  var _cart = React.useState(editing && editing.parts ? editing.parts.slice() : []), cart = _cart[0], setCart = _cart[1];
  var _partQuery = React.useState(""), partQuery = _partQuery[0], setPartQuery = _partQuery[1];
  var _saving = React.useState(false), saving = _saving[0], setSaving = _saving[1];
  var _photos = React.useState(editing && editing.photos ? editing.photos.slice() : []), photos = _photos[0], setPhotos = _photos[1];
  var _uploading = React.useState(false), uploading = _uploading[0], setUploading = _uploading[1];
  // 新增叫修單時先選好的照片(還沒有工單編號,先放在手機上,單子存好後在背景自動上傳)
  var _newPhotos = React.useState([]), newPhotos = _newPhotos[0], setNewPhotos = _newPhotos[1];
  var _showDeleteConfirm = React.useState(false), showDeleteConfirm = _showDeleteConfirm[0], setShowDeleteConfirm = _showDeleteConfirm[1];
  var _deletePassword = React.useState(""), deletePassword = _deletePassword[0], setDeletePassword = _deletePassword[1];
  var _deleting = React.useState(false), deleting = _deleting[0], setDeleting = _deleting[1];

  // 只有故障叫修會從叫修單扣庫存;補碳粉、送貨的東西是在庫存系統領料時就扣掉了
  var showParts = dispatchType === "故障叫修";
  // 零件要等處理狀態選「已完成」才出現:結案時才選實際換了什麼,避免開單時先選一次、結案又選一次變成重複

  // 「待下次送碳粉」要選抄表客戶,抄表系統首頁才會提醒這家要順便送碳粉
  var _meterId = React.useState(editing ? (editing.meterCustomerId || "") : ""), meterId = _meterId[0], setMeterId = _meterId[1];
  var _meterName = React.useState(editing ? (editing.meterCustomerName || "") : ""), meterName = _meterName[0], setMeterName = _meterName[1];
  var _meterQuery = React.useState(""), meterQuery = _meterQuery[0], setMeterQuery = _meterQuery[1];
  var meterList = props.meterCustomers || [];
  var wantsToner = status === "待下次送碳粉";
  var needMeter = wantsToner && props.meterLinked && meterList.length > 0;
  function normName_(v) { return String(v || "").replace(/[\s\-－_()（）.．]/g, "").toLowerCase(); }
  var meterSelected = meterId
    ? (meterList.filter(function (m) { return m.id === meterId; })[0] || { id: meterId, name: meterName, dist: "", owner: "" })
    : null;
  var meterTyped = (needMeter && !meterId && meterQuery)
    ? meterList.filter(function (m) {
        var q = normName_(meterQuery);
        return normName_(m.name).indexOf(q) !== -1 || normName_(m.id).indexOf(q) !== -1;
      }).slice(0, 8)
    : [];
  // 還沒打字時,用叫修單的客戶名稱猜幾家可能的,點一下就選好
  var meterGuess = (needMeter && !meterId && !meterQuery && customerName)
    ? (function () {
        var base = normName_(customerName), head2 = base.slice(0, 2);
        return meterList.filter(function (m) {

        }).slice(0, 6);
      })()
    : [];
  function pickMeter(m) { setMeterId(m.id); setMeterName(m.name); setMeterQuery(""); }
  var techOptions = props.technicians.map(function (t) { return t.name; });
  var statusOptions = isNew ? props.statusList.filter(function (s) { return s !== "已完成"; }) : props.statusList;

  var custMatches = customerQuery
    ? props.customers.filter(function (c) { return c.name.toLowerCase().indexOf(customerQuery.toLowerCase()) !== -1; }).slice(0, 8)

  var partMatches = partQuery

    : [];

  function addPart(p) {
    var exists = cart.some(function (c) { return c.model === p.model; });

  }
  function removePart(model) {
    setCart(cart.filter(function (c) { return c.model !== model; }));
  }
  function changeQty(model, qty) {

    setCart(cart.map(function (c) { return c.model === model ? Object.assign({}, c, { qty: qty }) : c; }));

  // 手機拍照原始檔通常好幾 MB,傳之前先壓縮到最長邊 1280px、JPEG 品質 0.72,避免上傳太慢或太占空間
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("讀取照片失敗")); };
      reader.onload = function () {
        var img = new Image();

        img.onload = function () {

  return h("div", null,
    h("div", { className: "page-title" }, "統計報表"),
    h("label", { className: "field-label" }, "選擇月份"),

    h("div", { className: "stat-tiles" },

        h("div", { className: "stat-tile-label" }, "這個月叫修單數"),
        h("div", { className: "stat-tile-value" }, inMonth.length)
      ),
      h("div", { className: "stat-tile" },
        h("div", { className: "stat-tile-label" }, "有叫修的客戶數"),

    ),
    h("div", { className: "section-title" }, "各客戶叫修次數(高到低)"),
    rows.length === 0 ? h("div", { className: "empty-hint" }, "這個月還沒有叫修紀錄") :
      rows.map(function (r) {
        return h("div", { key: r.name, className: "stock-row" },
          h("div", null, h("div", { className: "stock-row-model" }, r.name)),
          h("div", { className: "stock-row-qty" }, r.count + " 次")
        );
      })
  );
}

/* ============================================================
 * 主 App
 * ============================================================ */
function LoginPage(props) {
  var _pw = React.useState(""), pw = _pw[0], setPw = _pw[1];
  function submit() {
    var v = String(pw || "").trim();
    if (!v) return;
    props.onLogin(v);
  }
  return h("div", { className: "center-screen" },
    h("div", { style: { width: "100%", maxWidth: "320px", textAlign: "left" } },
      h("div", { className: "page-title", style: { textAlign: "center" } }, "叫修系統"),
      props.message ? h("div", { className: "warn-hint", style: { marginBottom: "10px" } }, props.message) : null,
      h("label", { className: "field-label" }, "存取密碼"),
      h("input", {
        className: "input", type: "password", autoFocus: true, placeholder: "請輸入存取密碼",
        value: pw, onChange: function (e) { setPw(e.target.value); },
        onKeyDown: function (e) { if (e.key === "Enter") submit(); }
      }),
      h("button", { className: "btn btn-primary btn-block", onClick: submit }, "進入"),
      h("div", { className: "field-hint-sm", style: { textAlign: "center", marginTop: "10px" } }, "輸入一次之後,這台裝置會記住")
    )
  );
}

function App() {
  var _loading = React.useState(true), loading = _loading[0], setLoading = _loading[1];
  var _needLogin = React.useState(needsLogin_), needLogin = _needLogin[0], setNeedLogin = _needLogin[1];
  var _loginMsg = React.useState(""), loginMsg = _loginMsg[0], setLoginMsg = _loginMsg[1];
  var _fresh = React.useState(false), fresh = _fresh[0], setFresh = _fresh[1];
  var _data = React.useState(null), data = _data[0], setData = _data[1];
  var _tab = React.useState("tickets"), tab = _tab[0], setTab = _tab[1]; // tickets | customers
  var _listFilter = React.useState("未處理"), listFilter = _listFilter[0], setListFilter = _listFilter[1]; // 叫修列表目前的分頁
  var _pendingNew = React.useState([]), pendingNew = _pendingNew[0], setPendingNew = _pendingNew[1]; // 背景送出中的新單
  var _formKey = React.useState(0), formKey = _formKey[0], setFormKey = _formKey[1];
  var saveChain = React.useRef(Promise.resolve());
  var pendSeq = React.useRef(0);
  var reloadSeq = React.useRef(0);
  var refreshTimer = React.useRef(null);
  // 資料同步狀態:最後一次成功從伺服器拿到資料的時間、失敗原因、是否正在抓
  var _syncedAt = React.useState(0), syncedAt = _syncedAt[0], setSyncedAt = _syncedAt[1];
  var _syncError = React.useState(""), syncError = _syncError[0], setSyncError = _syncError[1];
  var _syncing = React.useState(false), syncing = _syncing[0], setSyncing = _syncing[1];
  var inFlight = React.useRef(0);
  var dataRef = React.useRef(null);
  dataRef.current = data;
  var reloadRef = React.useRef(null);
  reloadRef.current = reload;
  // 自動更新:從背景切回 App(離開超過 30 秒)時馬上抓一次,開著的時候每 3 分鐘抓一次
  React.useEffect(function () {
    var hiddenAt = 0;
    function refreshNow() {
      if (document.visibilityState !== "visible") return;
      if (needsLogin_() || inFlight.current > 0 || !dataRef.current) return;
      reloadRef.current();
    }
    var timer = setInterval(refreshNow, AUTO_REFRESH_MS);
    function onVis() {
      if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 30000) refreshNow();
      hiddenAt = 0;
    }
    document.addEventListener("visibilitychange", onVis);
    return function () { clearInterval(timer); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  var _updateReady = React.useState(false), updateReady = _updateReady[0], setUpdateReady = _updateReady[1];
  React.useEffect(function () {
    function check() { checkForUpdate_().then(function (yes) { if (yes) setUpdateReady(true); }); }
    check();
    function onVisible() { if (document.visibilityState === "visible") check(); }
    document.addEventListener("visibilitychange", onVisible);
    return function () { document.removeEventListener("visibilitychange", onVisible); };
  }, []);
  var photoChain = React.useRef(Promise.resolve());
  var _photoJobs = React.useState(0), photoJobs = _photoJobs[0], setPhotoJobs = _photoJobs[1]; // 背景上傳中的照片張數

  // 還有單子在背景送出時關掉網頁,先跳提醒,避免單子沒存到
  React.useEffect(function () {
    var busy = photoJobs > 0 || pendingNew.some(function (p) { return p.state === "saving"; });
    if (!busy) return;
    function warn(e) { e.preventDefault(); e.returnValue = ""; return ""; }
    window.addEventListener("beforeunload", warn);
    return function () { window.removeEventListener("beforeunload", warn); };
  }, [pendingNew, photoJobs]);
  var _page = React.useState("list"), page = _page[0], setPage = _page[1]; // list | form | detail
  var _activeTicket = React.useState(null), activeTicket = _activeTicket[0], setActiveTicket = _activeTicket[1];
  var _activeCustomer = React.useState(null), activeCustomer = _activeCustomer[0], setActiveCustomer = _activeCustomer[1];
  var _showCustForm = React.useState(false), showCustForm = _showCustForm[0], setShowCustForm = _showCustForm[1];
  var _editingCustomer = React.useState(null), editingCustomer = _editingCustomer[0], setEditingCustomer = _editingCustomer[1];
  var _toast = React.useState(null), toast = _toast[0], setToast = _toast[1];
  var _err = React.useState(""), err = _err[0], setErr = _err[1];

  function showToast(message, type) {
    setToast({ message: message, type: type || "success" });
    setTimeout(function () { setToast(null); }, 3000);
  }

  // 零件庫存 / 抄表客戶清單:伺服器快取剛好過期時,列表會先出來,這兩份在背景另外補上
  var lookupsBusy = React.useRef(false);
  function loadLookups() {
    if (lookupsBusy.current) return;
    lookupsBusy.current = true;
    gsRun("getLookups").then(function (l) {
      lookupsBusy.current = false;
      setData(function (prev) {
        if (!prev) return prev;
        var next = Object.assign({}, prev, { parts: l.parts || [], meterCustomers: l.meterCustomers || [], lookupsPending: false });
        writeCache_(next);
        return next;
      });
    }).catch(function () {
      lookupsBusy.current = false;
      setData(function (prev) { return prev ? Object.assign({}, prev, { lookupsPending: false }) : prev; });
    });
  }

  // useCache 只在剛開啟網頁那一次用:先秀上次存在這台裝置的資料讓畫面馬上出來,同時在背景抓最新的換上去
  function reload(useCache) {
    var cached = useCache === true ? readCache_() : null;
    if (cached) { setData(cached); setLoading(false); setSyncedAt(cached._syncedAt || 0); }
    else if (!dataRef.current) { setLoading(true); }
    var req = useCache === true ? takeEarlyBoot_() : gsRun("getBootstrap");
    reloadSeq.current += 1;
    var mySeq = reloadSeq.current;
    inFlight.current += 1;
    setSyncing(true);
    function finished() {
      inFlight.current = Math.max(0, inFlight.current - 1);
      if (!inFlight.current) setSyncing(false);
    }
    req.then(function (d) {
      finished();
      if (mySeq !== reloadSeq.current) return;   // 這次抓完之前畫面上又有新的修改,舊的結果就不用了
      var now = Date.now();
      setData(function (prev) {
        var next = Object.assign({}, d, { _syncedAt: now });
        // 這次伺服器沒附零件/抄表清單的話,先沿用手上舊的,等背景補上再換
        if (d.lookupsPending && prev) {
          next.parts = prev.parts || [];
          next.meterCustomers = prev.meterCustomers || [];
        }
        writeCache_(next);
        return next;
      });
      setSyncedAt(now);
      setSyncError("");
      setLoading(false);
      setFresh(true);
      if (d.lookupsPending) loadLookups();
    }).catch(function (e) {
      finished();
      if (mySeq !== reloadSeq.current) return;
      if (e && e.code === "AUTH") {
        // 密碼錯誤或被改掉了:清掉記住的密碼跟快取,回到登入畫面
        setPw_("");
        clearCache_();
        setData(null);
        setSyncedAt(0);
        setSyncError("");
        setLoginMsg(e.message || "密碼錯誤");
        setNeedLogin(true);
        setLoading(false);
        return;
      }
      if (cached || dataRef.current) {
        // 畫面上已經有資料:不要整頁變成錯誤畫面,改成上方一直掛著的提醒,
        // 讓人知道現在看到的是舊資料、以及抓不到新資料的原因
        setSyncError((e && e.message) || "載入失敗");
        setLoading(false);
        return;
      }
      setErr((e && e.message) || "載入失敗");
      setLoading(false);
    });
  }

  function doLogin(pw) {
    setPw_(pw);
    setLoginMsg("");
    setNeedLogin(false);
    reload();
  }
  function doUpdate() {
    var busy = photoJobs > 0 || pendingNew.some(function (p) { return p.state === "saving"; });
    if (busy) { showToast("還有單子或照片在背景儲存,等存完再更新", "warning"); return; }
    forceUpdate_();
  }
  function doLogout() {
    setPw_("");
    clearCache_();
    setData(null);
    setSyncedAt(0);
    setSyncError("");
    setLoginMsg("");
    setNeedLogin(true);
  }

  React.useEffect(function () { if (!needsLogin_()) reload(true); }, []);

  // Email 裡的連結會帶 ?ticket=xxx。
  // 在 Apps Script 裡用 google.script.url.getLocation 讀網址參數;放在 GitHub 等外部網站時直接讀 location.search。
  // 資料載入後如果有這個值,就直接跳到那張單的編輯畫面,不用自己再去列表找
  var _initTicketId = React.useState(""), initTicketId = _initTicketId[0], setInitTicketId = _initTicketId[1];
  React.useEffect(function () {
    try {
      if (inAppsScript_()) {
        if (google.script.url && google.script.url.getLocation) {
          google.script.url.getLocation(function (location) {
            var id = location && location.parameter && location.parameter.ticket;
            if (id) setInitTicketId(String(id));
          });
        }
      } else {
        var id2 = new URLSearchParams(window.location.search).get("ticket");
        if (id2) setInitTicketId(String(id2));
      }
    } catch (e) { /* 讀不到網址參數就算了,不影響正常使用 */ }
  }, []);

  // 要等到抓到最新資料(fresh)才跳轉,避免用到舊快取裡還沒有的新單或舊內容;找到之後才算完成
  var deepLinkDone = React.useRef(false);
  React.useEffect(function () {
    if (!data || !initTicketId || !fresh || deepLinkDone.current) return;
    var found = data.tickets.filter(function (t) { return String(t.ticketId) === String(initTicketId); })[0];
    if (found) {
      deepLinkDone.current = true;
      setTab("tickets");
      setActiveTicket(found);
      setPage("form");
    }
  }, [data, initTicketId, fresh]);

  if (needLogin) {
    return h(LoginPage, { message: loginMsg, onLogin: doLogin });
  }
  if (err) {
    return h("div", { className: "center-screen" },
      h("div", { className: "error-box" },
        h("div", null, "無法載入系統"),
        h("div", { style: { fontSize: "13px", color: "var(--muted)" } }, err),
        h("button", { className: "btn", onClick: function () { setErr(""); reload(); } }, "重新整理")
      )
    );
  }
  if (loading || !data) {
    return h("div", { className: "center-screen" }, "載入中…");
  }

  function openTicket(t) { setActiveTicket(t); setPage("form"); }
  function openNewTicket() { setActiveTicket(null); setPage("form"); }

  // 新增的叫修單在背景一張一張依序送出(照填寫順序編號),不用等
  function runPending(item) {
    setPendingNew(function (list) {
      return list.map(function (p) { return p.localId === item.localId ? Object.assign({}, p, { state: "saving", error: "" }) : p; });
    });
    saveChain.current = saveChain.current.then(function () {
      return gsRun("addTicket", item.payload).then(function (res) {
        var p = item.payload;
        var saved = {
          ticketId: String(res.ticketId), createdAt: p.createdAt, customerId: p.customerId, customerName: p.customerName,
          dispatchType: p.dispatchType, description: p.description, parts: [], technician: p.technician,
          status: p.status, completedAt: "", note: p.note, photos: [], stockDeducted: false,
          meterCustomerId: p.meterCustomerId || "", meterCustomerName: p.meterCustomerName || ""
        };
        upsertTicket(saved);
        setPendingNew(function (list) { return list.filter(function (x) { return x.localId !== item.localId; }); });
        showToast("#" + res.ticketId + " " + p.customerName + " 已建立" + (item.photos.length ? ",照片上傳中…" : ""), "success");
        if (item.photos.length) uploadPhotosLater(String(res.ticketId), item.photos);
        scheduleRefresh();
      }, function (err) {
        setPendingNew(function (list) {
          return list.map(function (p) { return p.localId === item.localId ? Object.assign({}, p, { state: "failed", error: (err && err.message) || "儲存失敗" }) : p; });
        });
        showToast(item.payload.customerName + " 沒有存成功,請到列表按「重新送出」", "error");
      });

  // 把一張單直接放進(或更新)畫面上的列表,不用等整份資料重新下載
  function upsertTicket(t) {
    reloadSeq.current += 1;   // 之前發出、還沒回來的同步結果比這次修改舊,回來時不要拿來蓋掉
    setData(function (prev) {
      if (!prev) return prev;
      var others = prev.tickets.filter(function (x) { return String(x.ticketId) !== String(t.ticketId); });
      var list = [t].concat(others).sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
      var next = Object.assign({}, prev, { tickets: list });
      writeCache_(next);
      return next;
    });
  }
  // 背景同步一次最新資料(連續存很多張時,等最後一張存完才同步一次)
  function scheduleRefresh() {
    clearTimeout(refreshTimer.current);
    refreshTimer.current = setTimeout(function () { reload(); }, 1500);
  }

  // 新單的照片:單子建好之後才有編號,這時才一張一張上傳(另外排隊,不會卡住下一張單的建立)
  function uploadPhotosLater(ticketId, list) {
    setPhotoJobs(function (n) { return n + list.length; });
    var failed = 0;
    list.forEach(function (ph) {
      photoChain.current = photoChain.current.then(function () {
        return gsRun("uploadTicketPhoto", { ticketId: ticketId, dataUrl: ph.dataUrl, fileName: ph.name }).then(function (all) {
          reloadSeq.current += 1;
          setData(function (prev) {
            if (!prev) return prev;
            var next = Object.assign({}, prev, { tickets: prev.tickets.map(function (t) {
              return String(t.ticketId) === ticketId ? Object.assign({}, t, { photos: all }) : t;
            }) });
            writeCache_(next);
            return next;
          });
        }, function () { failed += 1; }).then(function () {
          setPhotoJobs(function (n) { return n - 1; });
        });
      });
    });
    photoChain.current = photoChain.current.then(function () {
      if (failed) showToast("#" + ticketId + " 有 " + failed + " 張照片沒上傳成功,請打開這張單再補傳", "error");
      else showToast("#" + ticketId + " 照片已上傳(" + list.length + " 張)", "success");
      scheduleRefresh();
    });
  }

  function discardPending(item) {
    setPendingNew(function (list) { return list.filter(function (p) { return p.localId !== item.localId; }); });
  }
  function submitNewTicket(payload, andNext, photos) {
    pendSeq.current += 1;
    var item = { localId: pendSeq.current, payload: payload, photos: photos || [], state: "saving", error: "" };
    setPendingNew(function (list) { return list.concat([item]); });
    runPending(item);
    if (andNext) {
      setFormKey(function (k) { return k + 1; });   // 換一張空白的新表單
      window.scrollTo(0, 0);
      showToast("已送出,可以直接填下一張", "success");
    } else {
      setTab("tickets");
      setPage("list");
    }
  }
  function backToTicketList(saved) {
    if (saved && saved.ticketId) upsertTicket(saved);   // 改好的內容馬上顯示,背景再同步
    if (saved && saved.deletedId) {
      reloadSeq.current += 1;
      setData(function (prev) {
        if (!prev) return prev;
        var next = Object.assign({}, prev, { tickets: prev.tickets.filter(function (x) { return String(x.ticketId) !== String(saved.deletedId); }) });
        writeCache_(next);
        return next;
      });
    }
    setPage("list");
    scheduleRefresh();
  }

  function openCustomer(c) { setActiveCustomer(c); setPage("detail"); }
  function backToCustomerList() { setPage("list"); setActiveCustomer(null); reload(); }

  var content;
  if (tab === "tickets") {
    content = page === "form"
      ? h(TicketFormPage, {
          key: "form-" + formKey, onSubmitNew: submitNewTicket,
          ticket: activeTicket, dispatchTypes: data.dispatchTypes, statusList: data.statusList,
          customers: data.customers, technicians: data.technicians, parts: data.parts,
          inventoryLinked: data.inventoryLinked, lookupsPending: !!data.lookupsPending, showToast: showToast,
          meterCustomers: data.meterCustomers || [], meterLinked: !!data.meterLinked,
          onSaved: backToTicketList, onCancel: function () { setPage("list"); }
        })
      : h(TicketListPage, { tickets: data.tickets, statusList: data.statusList, filter: listFilter, onFilter: setListFilter, onOpen: openTicket, onNew: openNewTicket,
          pending: pendingNew, onRetry: runPending, onDiscard: discardPending });
  } else if (tab === "reports") {
    content = h(ReportsPage, { tickets: data.tickets });
  } else {
    content = page === "detail" && activeCustomer
      ? h(CustomerDetailPage, { customer: activeCustomer, onBack: backToCustomerList, onEdit: function (c) { setEditingCustomer(c); setShowCustForm(true); } })
      : h(CustomerListPage, {
          customers: data.customers, onOpen: openCustomer,
          onAdd: function () { setEditingCustomer(null); setShowCustForm(true); }
        });
  }

  return h("div", { className: "app-shell" },
    h("div", { className: "top-bar" },
      h("div", { className: "top-bar-title" }, "叫修系統"),
      !inAppsScript_() ? h("div", { className: "top-bar-actions" },
        h("button", { className: "btn-ghost", onClick: doUpdate, title: "重新載入最新版本" }, "⟳ 更新"),
        h("button", { className: "btn-ghost", onClick: doLogout }, "登出")
      ) : null
    ),
    updateReady ? h("button", { className: "update-banner", onClick: doUpdate }, "🔄 有新版本,點這裡更新") : null,
    syncError ? h("div", { className: "sync-warn" },
      h("div", { style: { fontWeight: 700 } }, "⚠️ 抓不到最新資料,現在看到的是 " + fmtSyncTime_(syncedAt) + " 的資料"),
      h("div", { className: "sync-warn-reason" }, "原因:" + syncError),
      h("button", { className: "btn btn-primary", disabled: syncing, onClick: function () { reload(); } }, syncing ? "重試中…" : "重試")
    ) : null,
    h("div", { className: "sync-line" },
      syncing
        ? h("span", null, "資料更新中…")
        : h("button", { type: "button", onClick: function () { reload(); }, title: "點一下重新抓最新資料" }, "資料時間 " + fmtSyncTime_(syncedAt) + " ↻"),
      h("span", null, "版本 " + APP_VERSION)
    ),
    h("div", { className: "tab-bar" },
      h("button", { className: "tab-btn" + (tab === "tickets" ? " active" : ""), onClick: function () { setTab("tickets"); setPage("list"); } }, "叫修列表"),
      h("button", { className: "tab-btn" + (tab === "reports" ? " active" : ""), onClick: function () { setTab("reports"); setPage("list"); } }, "統計報表"),
      h("button", { className: "tab-btn" + (tab === "customers" ? " active" : ""), onClick: function () { setTab("customers"); setPage("list"); setActiveCustomer(null); } }, "客戶清單")
    ),
    h("div", { className: "main-content" }, content),
    showCustForm ? h(CustomerFormModal, {
      customer: editingCustomer, showToast: showToast,
      onClose: function () { setShowCustForm(false); },
      onSaved: function () { setShowCustForm(false); reload(); }
    }) : null,
    h(Toast, { toast: toast })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
